name: Change request
description: Propose a new feature or a change in behaviour. This becomes the change's intent.
title: "[Change]: "
labels: ["change-request"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the outcome in your own words. Do not propose screens or code yet; that comes in the specification.
        Never include patient records, personal details, credentials or tokens. Describe data by type, for example "appointment times".
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what happens today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What will be true for the user when this is done?
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected users and systems
      description: Which users, applications and backend services does this touch?
      placeholder: |
        Users: front desk staff
        Applications: HealthSchedule
        Backend: HealthSchedule API
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Deadlines, approvals, devices, offline use, or anything else that is fixed.
  - type: dropdown
    id: personal-data
    attributes:
      label: Personal or health data
      description: Does this collect, show, store or send personal or health data in a new way?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: What still needs an answer, and who can answer it?
